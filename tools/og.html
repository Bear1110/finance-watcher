<!doctype html>
<!-- 分享預覽圖的模板：瀏覽器視窗 1200×630 截圖後執行 python tools/make-icons.py 截圖.png -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1200px;height:630px;display:flex;align-items:center;gap:64px;padding:0 80px;box-sizing:border-box;
  background:radial-gradient(circle at 25% 50%,#22365a 0,#17273f 45%,#0f1724 100%);
  font-family:"PingFang TC","Noto Sans TC","Heiti TC",-apple-system,sans-serif;color:#e8ecf1}
img{width:400px;height:400px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));flex:none}
h1{font-size:76px;margin:0 0 18px;font-weight:700;letter-spacing:-1px;color:#fff}
.tag{font-size:38px;margin:0 0 28px;color:#fbbf24;font-weight:600}
ul{list-style:none;margin:0;padding:0;font-size:28px;line-height:1.75;color:#a9b8cf}
li::before{content:"•";color:#34d399;margin-right:14px}
</style></head><body>
<img src="../icons/icon-512.png" alt="">
<div><h1>Finance Watcher</h1><p class="tag">個人財務記錄</p>
<ul><li>資產快照、台美股持倉與損益</li><li>收支、預算與投資績效</li><li>資料存在你自己的 Google 試算表</li></ul></div>
</body></html>
